version: "3"

services:
  whisper:
    container_name: faster-whisper-rocm
    restart: unless-stopped
    build:
      context: .
    image: wyoming-faster-whisper-rocm
    volumes:
      - ./data:/data
    ports:
      - "10300:10300"
    devices:
      - "/dev/dri"
      - "/dev/kfd"
    environment:
      - PYTORCH_ROCM_ARCH=gfx1201
